apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scriptbee-userdata-pvc
  namespace: scriptbee
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scriptbee-plugins-pvc
  namespace: scriptbee
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scriptbee-mongodb-pvc
  namespace: scriptbee
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
