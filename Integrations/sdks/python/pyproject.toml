[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptbee-analysis-sdk"
version = "1.0.0"
description = "Server SDK for developing ScriptBee Analysis Services."
requires-python = ">=3.12"
license = { file = "../../../LICENSE" }
authors = [{ name = "dxworks" }]
keywords = ["scriptbee", "analysis", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-exporter-otlp>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/dxworks/scriptbee"
Repository = "https://github.com/dxworks/scriptbee"
Source = "https://github.com/dxworks/scriptbee/tree/master/integrations/sdks/python/scriptbee_analysis_sdk"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
    "ruff>=0.16.8",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-exporter-otlp>=1.45.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["scriptbee_analysis_sdk"]
