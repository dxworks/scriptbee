name: Release Default Bundle

on:
  push:
    tags:
      - 'bundle@*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. bundle@1.2.3 or v1.2.3)"
        required: false

jobs:
  build-and-publish:
    name: Build and Publish Default Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Plugins/UI/default-scriptbee-charts/package-lock.json

      - name: Extract version from tag
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REF_NAME="$INPUT_TAG"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$REF_NAME" == *"@"* ]]; then
            VERSION="${REF_NAME#*@}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=scriptbee-default-bundle-$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Prepare and zip default plugin bundle
        run: |
          chmod +x ./scripts/create_default_bundle_zip.sh
          chmod +x ./scripts/prepare_default_plugin_bundle.sh
          chmod +x ./scripts/prepare_plugin_folder.sh
          chmod +x ./scripts/prepare_ui_charts_plugin.sh
          sh ./scripts/create_default_bundle_zip.sh "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.zip_name }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: default-bundle
          path: ${{ steps.meta.outputs.zip_name }}

  create-release:
    name: Create GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REF_NAME="$INPUT_TAG"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$REF_NAME" == *"@"* ]]; then
            VERSION="${REF_NAME#*@}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=scriptbee-default-bundle-$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Download bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: default-bundle
          path: dist

      - name: Extract changelog for current version
        id: changelog
        run: |
          chmod +x ./scripts/extract_changelog.sh
          ./scripts/extract_changelog.sh "${{ steps.meta.outputs.version }}" Plugins/CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/${{ steps.meta.outputs.zip_name }}
