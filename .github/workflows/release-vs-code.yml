name: Release VS Code Extension

on:
  push:
    tags:
      - 'vs-code@*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. vs-code@1.1.0 or v1.1.0)"
        required: false

jobs:
  build-and-publish:
    name: Build and Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Integrations/VS-Code

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Integrations/VS-Code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Extract version from tag
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REF_NAME="$INPUT_TAG"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$REF_NAME" == *"@"* ]]; then
            VERSION="${REF_NAME#*@}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          NEW_VERSION=${{ steps.meta.outputs.version }}
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            npm version $NEW_VERSION --no-git-tag-version
          else
            echo "Version is already $NEW_VERSION, skipping update."
          fi

      - name: Package Extension
        run: npx vsce package

      # TODO(#10): Uncomment when we have a PAT for the marketplace
      # - name: Publish to VS Code Marketplace
      #   run: npx vsce publish -p ${{ secrets.VSCE_PAT }} --no-git-tag-version
      #   continue-on-error: true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scriptbee-vscode-extension-${{ steps.meta.outputs.version }}
          path: Integrations/VS-Code/*.vsix

  create-release:
    name: Create GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REF_NAME="$INPUT_TAG"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$REF_NAME" == *"@"* ]]; then
            VERSION="${REF_NAME#*@}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scriptbee-vscode-extension-${{ steps.meta.outputs.version }}
          path: .

      - name: Extract changelog for current version
        id: changelog
        run: |
          chmod +x ./scripts/extract_changelog.sh
          ./scripts/extract_changelog.sh "${{ steps.meta.outputs.version }}" Integrations/VS-Code/CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: "*.vsix"
