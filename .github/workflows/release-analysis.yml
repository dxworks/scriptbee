name: Release Analysis

on:
  push:
    tags:
      - 'analysis@*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. analysis@1.2.3 or v1.2.3)"
        required: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ScriptBee.slnx

      - name: Build
        run: dotnet build ScriptBee.slnx --no-restore

      - name: Test
        run: dotnet test ScriptBee.slnx --no-build --verbosity normal

  analysis-build-push:
    name: Analysis Build & Push Docker
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      # QEMU is needed to emulate ARM instructions on an x86 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REF_NAME="$INPUT_TAG"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$REF_NAME" == *"@"* ]]; then
            VERSION="${REF_NAME#*@}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Analysis Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./analysis.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            dxworks/scriptbee-analysis:${{ steps.meta.outputs.version }}
            dxworks/scriptbee-analysis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
