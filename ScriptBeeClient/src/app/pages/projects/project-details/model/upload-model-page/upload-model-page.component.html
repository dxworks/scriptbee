@if (instanceId()) {
  <div class="project-model-section-title project-model-content-after-divider">Upload Files</div>

  <app-drag-and-drop-files [(files)]="files"></app-drag-and-drop-files>

  @if (isUploadLoading()) {
    <app-loading-progress-bar title="Uploading Files..."></app-loading-progress-bar>
  }

  <div class="upload-files-container">
    <button mat-flat-button [disabled]="files.length === 0 || isUploadLoading()" (click)="onUploadFilesClick()">Upload Files</button>
  </div>

  <mat-divider></mat-divider>

  <div class="project-model-section-title project-model-content-after-divider">Uploaded Project Files</div>

  @if (savedFiles().length === 0) {
    <div class="empty-state-message">No files uploaded yet.</div>
  } @else {
    <mat-list class="saved-files-list">
      @for (file of savedFiles(); track file.id) {
        <mat-list-item>
          <mat-icon matListItemIcon>description</mat-icon>
          <div matListItemTitle>{{ file.name }}</div>
          <div matListItemMeta>
            <button mat-icon-button color="warn" matTooltip="Delete file" [disabled]="deletingFileId() === file.id" (click)="onDeleteFile(file)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-list-item>
      }
    </mat-list>
  }
}
